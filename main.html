<!DOCTYPE html>

<html>

<head>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <form method="post">

        <label for="name">Name:</label>
        <input id="name" name="name" type="text" required>

        <label for="email">Email:</label>
        <input id="email" name="email" type="email" required>

        <label for="gender_m">Male</label>
        <input id="gender_m" name="gender" type="radio" value="male" required>

        <label for="gender_f">Female</label>
        <input id="gender_f" name="gender" type="radio" value="female" required>

        <label for="laptop">Laptop Brands:</label>
        <select id="laptop" name="laptop">
            <option>Apple</option>
            <option>Asus</option>
            <option>HP</option>
        </select>

        <label for="age">Age:</label>
        <input id="age" name="age" type="number" required>

        <label for="dob">Date of Birth:</label>
        <input id="dob" name="dob" type="date" required>

        <label for="password">Password:</label>
        <input id="password" name="password" type="password" required>

        <label for="portfolio">Portfolio URL:</label>
        <input id="portfolio" name="portfolio" type="url" required>

        <button type="submit">Submit</button>

    </form>

</body>

</html>
